"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
palette = "rose_pine"
command_timeout = 1000

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold #ebbcba"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "#c4a7e7"
truncation_length = 20
truncation_symbol = "…"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "#908caa"
conflicted = "[~](#eb6f92)"
ahead = "[⇡${count}](#c4a7e7)"
behind = "[⇣${count}](#f6c177)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](#eb6f92)"
untracked = "[?](#908caa)"
stashed = "[*](#9ccfd8)"
modified = "[!](#f6c177)"
staged = "[+](#31748f)"
renamed = "[»](#9ccfd8)"
deleted = "[✘](#eb6f92)"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2_000
style = "#908caa"
format = "[󱎫 $duration]($style) "

[character]
success_symbol = "[❯](#31748f)"
error_symbol = "[❯](#eb6f92)"
vicmd_symbol = "[❮](#c4a7e7)"

[palettes.rose_pine]
base = "#191724"
surface = "#1f1d2e"
overlay = "#26233a"
muted = "#6e6a86"
subtle = "#908caa"
text = "#e0def4"
love = "#eb6f92"
gold = "#f6c177"
rose = "#ebbcba"
pine = "#31748f"
foam = "#9ccfd8"
iris = "#c4a7e7"
