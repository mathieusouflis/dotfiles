"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
# Theme (all 3 variant palettes defined below, from github.com/version14/starship-theme)
palette = "version14"
command_timeout = 1000

format = """
$directory$git_branch$git_status$cmd_duration
$character"""

[directory]
style = "bold accent"
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "accent"
truncation_length = 20
truncation_symbol = "…"
format = "[$symbol$branch(:$remote_branch)]($style) "

[git_status]
style = "fg_muted"
conflicted = "[~](red)"
ahead = "[⇡${count}](accent)"
behind = "[⇣${count}](yellow)"
diverged = "[⇕⇡${ahead_count}⇣${behind_count}](red)"
untracked = "[?](fg_muted)"
stashed = "[*](cyan)"
modified = "[!](yellow)"
staged = "[+](blue)"
renamed = "[»](cyan)"
deleted = "[✘](red)"
format = "[$all_status$ahead_behind]($style) "

[cmd_duration]
min_time = 2_000
style = "fg_muted"
format = "[󱎫 $duration]($style) "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](accent)"

[palettes.version14]
bg = "#1A1E23"
bg_elevated = "#14171B"
fg = "#F2F4F6"
fg_muted = "#6E737A"
accent = "#B7A2FF"
red = "#FF5C59"
green = "#4BDE7F"
yellow = "#FFA85E"
blue = "#78AFFF"
magenta = "#ED8EF3"
cyan = "#B7A2FF"
border = "#1A1E23"

