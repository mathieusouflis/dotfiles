prSections:
  - title: My Pull Requests
    filters: is:open author:@me
  - title: Needs My Review
    filters: is:open review-requested:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

issuesSections:
  - title: My Issues
    filters: is:open author:@me
  - title: Assigned
    filters: is:open assignee:@me
  - title: Involved
    filters: is:open involves:@me -author:@me

notificationsSections:
  - title: All
    filters: ""
  - title: Review Requested
    filters: reason:review-requested
  - title: Mentioned
    filters: reason:mention
  - title: Assigned
    filters: reason:assign

repo:
  branchesRefetchIntervalSeconds: 30
  prsRefetchIntervalSeconds: 60

defaults:
  preview:
    open: false
    width: 70
  prsLimit: 20
  issuesLimit: 20
  notificationsLimit: 20
  view: prs
  refetchIntervalMinutes: 30

# Theme (active variant pasted below; all variants vendored in themes/,
# from github.com/version14/gh-dash-theme -- swap by pasting a different
# themes/version14-*.yml file's contents in here)
theme:
  colors:
    text:
      primary: "#F2F4F6"
      secondary: "#B7A2FF"
      inverted: "#1A1E23"
      faint: "#6E737A"
      warning: "#FFA85E"
      success: "#4BDE7F"
      actor: "#B7A2FF"
    background:
      selected: "#1A1E23"
    border:
      primary: "#B7A2FF"
      secondary: "#78AFFF"
      faint: "#1A1E23"
    icon:
      newcontributor: "#ED8EF3"
      contributor: "#FFA85E"
      collaborator: "#4BDE7F"
      member: "#78AFFF"
      owner: "#B7A2FF"
      unknownrole: "#6E737A"
  ui:
    sectionsShowCount: true
    table:
      showSeparator: true
      compact: true

confirmQuit: false
showAuthorIcons: true
smartFilteringAtLaunch: true
